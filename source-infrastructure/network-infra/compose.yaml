services:
  web:
    image: nginx:alpine
    container_name: netra-source-web
    ports:
      - "8080:80"
    volumes:
      - ./source-infrastructure/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./source-infrastructure/web/html:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [public_net, app_net, twin_net]
  api:
    build: ./source-infrastructure/api
    container_name: netra-source-api
    environment:
      DB_HOST: source-db
      DB_PORT: "5432"
      DB_NAME: ${SOURCE_DB_NAME:-college_app}
      DB_USER: ${SOURCE_DB_USER:-app_user}
      DB_PASSWORD: ${SOURCE_DB_PASSWORD:-local_demo_password}
    depends_on:
      source-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app_net, data_net]
  source-db:
    image: postgres:16-alpine
    container_name: netra-source-db
    environment:
      POSTGRES_DB: ${SOURCE_DB_NAME:-college_app}
      POSTGRES_USER: ${SOURCE_DB_USER:-app_user}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:-local_demo_password}
    volumes:
      - source_db_data:/var/lib/postgresql/data
      - ./source-infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOURCE_DB_USER:-app_user} -d ${SOURCE_DB_NAME:-college_app}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data_net]
  neo4j:
    image: neo4j:latest
    container_name: netra-twin-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/netra_password}
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p netra_password 'RETURN 1;' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [twin_net]
  twin-importer:
    build: ./twin
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: netra_password
    volumes: [./inventory:/app/inventory:ro]
    depends_on:
      neo4j:
        condition: service_healthy
    networks: [twin_net]
    profiles: [tools]

networks:
  public_net: {}
  app_net: { internal: true }
  data_net: { internal: true }
  twin_net: { internal: true }
volumes:
  source_db_data: {}
  neo4j_data: {}
