<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NETRA Source Network</title></head><body><h1>NETRA Source Network</h1><p>Browser to Nginx Web to FastAPI to PostgreSQL</p><button id="load">Load student data</button><pre id="output">Press the button to test the complete path.</pre><script>document.getElementById('load').onclick=async()=>{const o=document.getElementById('output');try{o.textContent=JSON.stringify(await (await fetch('api/students')).json(),null,2)}catch(e){o.textContent=String(e)}};</script></body></html>
